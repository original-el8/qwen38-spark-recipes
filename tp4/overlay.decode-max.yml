# Decode-max profile: C1 64.8 tok/s (vs author cold-wall 53.5, +21%), steps/s 37.0.
# Prefill drops to 3,3-3,4xx tok/s (still ~author prefill 3,65-3,81x; below the
# default profile's 4,4-4,7xx). Choose this only for decode-dominant serving.
#
# Requires image spark-vllm:qwen38-b12xe39b437b-nightly20260925-r1 on every rank:
#   FROM eugr/spark-vllm-b12x:nightly-20260925
#   COPY b12x-1.3.0-py3-none-any.whl /tmp/
#   RUN python3 -m pip install --force-reinstall --no-deps /tmp/b12x-1.3.0-py3-none-any.whl && rm /tmp/b12x-1.3.0-py3-none-any.whl
# Wheel: github.com/local-inference-lab/b12x release b12x-cu134-beta-e39b437bf7d5c6784fbee8dc7e87073dde753445
#   sha256 345dad402182c1f83ad485a654e6431faa8d2222a12888cc161aa5309763c42d (verified vs release SHA256SUMS)
# NOTE: older mainline wheels (e.g. d5139035 / PR #394) FAIL startup with this vLLM:
#   'TuningRequirement' object has no attribute 'rejected_count' — the eugr b12x line is
#   diverged from b12x main (17 ahead / 13 behind), not a subset. Only 2026-09-26+ main satisfies the API.
# EXPERIMENTAL: this wheel is b12x MAINLINE — it lacks eugr's 17 fork-ahead commits
# (GB10/Spark-specific fixes). Smoke passed (arithmetic/tool-calls/vision); full
# behavioral/quality qualification NOT run. Shipped default avoids this trade.
services:
  qwen38-flash-next:
    image: spark-vllm:qwen38-b12xe39b437b-nightly20260925-r1
    environment:
      BLOCK_SIZE: "32"
      VLLM_QWEN3_8_HC_PREFILL_MODE: shard
      VLLM_QWEN3_8_PREFILL_COALESCE: "1"
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_LM_HEAD_A16: "1"
      VLLM_MTP_NVFP4_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
      VLLM_QWEN3_8_FLASH_NEXT_MTP_COMPACT: "1"
      VLLM_QWEN3_8_FLASH_NEXT_OVERLAP: "1"
      VLLM_GDN_SPEC_DECODE_METADATA_FASTPATH: "1"
      ATTENTION_BACKEND: B12X
      RECURRENT_CHECKPOINT_POLICY: aligned

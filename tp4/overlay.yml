# Overlay onto the base compose: the campaign Qwen-prefill image + its engine env delta.
# This is the ENTIRE overlay surface — image + these envs, nothing else.
# Image build: ../build/README.md (vLLM dev/karmic-kraken@76061de4 + b12x@d2d5368d onto the
# eugr base; contexts retained at maxwell:/home/jasonc/spark_vllm/build-contexts/<tag>/).
# Usage: docker compose --env-file <host>.env -p <project> -f compose.yml -f overlay.yml up -d
services:
  qwen38-flash-next:
    image: spark-vllm:qwen38-qsa-selection-76061de4-b12xd2d5368d-sm121-image-r1
    environment:
      # HC token-row-sharded prefill + coalescing (the +34% cold-prefill work)
      VLLM_QWEN3_8_HC_PREFILL_MODE: shard
      VLLM_QWEN3_8_PREFILL_COALESCE: "1"
      # LM-head / MoE scale / MTP compact+overlap / spec-decode metadata fastpath
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_LM_HEAD_A16: "1"
      VLLM_MTP_NVFP4_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
      VLLM_QWEN3_8_FLASH_NEXT_MTP_COMPACT: "1"
      VLLM_QWEN3_8_FLASH_NEXT_OVERLAP: "1"
      VLLM_GDN_SPEC_DECODE_METADATA_FASTPATH: "1"
      # serve.sh variant flags (overlay build only — stock CLI rejects these)
      ATTENTION_BACKEND: B12X
      RECURRENT_CHECKPOINT_POLICY: aligned
      # Base compose pins V2 runner "1"; an override must set a value ("" crashes the
      # engine's int parse; unset inherits the base). The campaign ran this UNSET (None);
      # "0" parses to False — the only settable near-equivalent, live-verified 2026-09-26:
      # prefill/decode match the campaign arm within noise, smoke 4/4.
      VLLM_USE_V2_MODEL_RUNNER: "0"

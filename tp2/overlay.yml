# Overlay for TP2 — same image, but the campaign TP2 profile runs HC prefill sharding OFF
# (token-row sharding targets >=3 ranks) with coalescing + the LM-head/MTP flags ON.
services:
  qwen38-flash-next:
    image: spark-vllm:qwen38-qsa-selection-76061de4-b12xd2d5368d-sm121-image-r1
    environment:
      VLLM_QWEN3_8_HC_PREFILL_MODE: "off"
      VLLM_QWEN3_8_PREFILL_COALESCE: "1"
      VLLM_MXFP8_LM_HEAD: "1"
      VLLM_LM_HEAD_A16: "1"
      VLLM_MTP_NVFP4_LM_HEAD: "1"
      VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE: w13
      VLLM_QWEN3_8_FLASH_NEXT_MTP_COMPACT: "1"
      VLLM_QWEN3_8_FLASH_NEXT_OVERLAP: "1"
      VLLM_GDN_SPEC_DECODE_METADATA_FASTPATH: "1"
      ATTENTION_BACKEND: B12X
      RECURRENT_CHECKPOINT_POLICY: aligned
      VLLM_USE_V2_MODEL_RUNNER: "0"

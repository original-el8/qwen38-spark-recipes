# NO-FLAGS BASELINE VARIANT (not the serving default): campaign TP2 profile WITHOUT the operator
# flag set, OVERLAP=0 kept at its campaign template value. Measured rows:
# tp2-overlay-preflags-verified-* in ../data/results.jsonl. Use: -f compose.yml -f overlay.no-flags.yml
# Overlay for TP2 — same image, but the campaign TP2 profile runs HC prefill sharding OFF
# (token-row sharding targets >=3 ranks) with coalescing + the LM-head/MTP flags ON.
services:
  qwen38-flash-next:
    image: spark-vllm:qwen38-qsa-selection-76061de4-b12xd2d5368d-sm121-image-r1
    environment:
      VLLM_QWEN3_8_HC_PREFILL_MODE: "off"
      VLLM_QWEN3_8_PREFILL_COALESCE: "1"
      VLLM_QWEN3_8_FLASH_NEXT_OVERLAP: "0"
      ATTENTION_BACKEND: B12X
      RECURRENT_CHECKPOINT_POLICY: aligned
      # V2 runner: this model REQUIRES the V2 model runner — pinning "0" crashes at
      # engine init (legacy path lacks Qwen3_8FlashNextConfig.image_token_index; live
      # crash 2026-09-26). Base compose ships "1" = what the campaign's unset(None=auto)
      # resolved to, so DO NOT override here.

# Qwen3.8-Flash-Next on DGX Sparks — ONE compose for both image variants and both topologies.
#   stock base : docker compose --env-file <host>.env -p <project> up -d
#   overlay    : add -f overlay.yml           (image + engine env delta, see that file)
#   topology   : driven by <host>.env (NNODES / TENSOR_PARALLEL_SIZE / KV budget). tp4/ ships
#               4-node defaults; tp2/ ships the 2-node files with identical contents otherwise.
# Every host runs `up -d` from ITS rank's env file; start workers first, coordinator last.
services:
  qwen38-flash-next:
    image: ${QWEN38_IMAGE:-eugr/spark-vllm-b12x:nightly-20260925}
    container_name: ${PROJECT_NAME:-qwen38-spark}-tp4-${NODE_RANK:-0}
    gpus: all
    network_mode: host
    ipc: host
    shm_size: 32g
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - SYS_PTRACE
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
      - label=disable
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    restart: "no"
    entrypoint: ["/experiment/serve.sh"]
    environment:
      # ---- engine (stock base defaults; overlay.yml adds/overrides its delta) ----
      VLLM_QWEN3_8_FLASH_NEXT_HC_TP: ${HC_TP:-1}
      VLLM_USE_V2_MODEL_RUNNER: "1"
      B12X_POLICY_MODE: auto
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_ENABLE_ROCE_ALLREDUCE: "1"
      VLLM_ROCE_ALLREDUCE_MAX_SIZE: 2MB
      VLLM_ROCE_ALLGATHER_MAX_SIZE: 16MB
      B12X_ROCE_SPIN_LIMIT: "50000000"
      B12X_ROCE_CACHE_DIR: /root/.cache/vllm/b12x-roce
      VLLM_ENABLE_PCIE_ALLREDUCE: ${VLLM_ENABLE_PCIE_ALLREDUCE:-0}
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_PLE_CPU_OFFLOAD: "0"
      # ---- fabric/NCCL pins for the 10.200.0.0/23 dual-HCA RoCE plane (GID index 3) ----
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-enP2p1s0f0np0}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME:-enP2p1s0f0np0}
      NCCL_IB_HCA: ${NCCL_IB_HCA:-rocep1s0f0,roceP2p1s0f0}
      NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-3}
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-10.200.0.0/23}
      NCCL_IB_DISABLE: "0"
      NCCL_NET: IB
      NCCL_NET_PLUGIN: none
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      NCCL_CROSS_NIC: "0"
      NCCL_IB_MERGE_NICS: "0"
      NCCL_PROTO: LL,LL128,Simple
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      # ---- identity/rank (from <host>.env) ----
      NODE_RANK: ${NODE_RANK:?set NODE_RANK to 0, 1, 2, or 3}
      MASTER_ADDR: ${MASTER_ADDR:?set MASTER_ADDR to the rank-zero fabric address}
      MASTER_PORT: ${MASTER_PORT:-29507}
      VLLM_HOST_IP: ${VLLM_HOST_IP:?set VLLM_HOST_IP to this node's fabric address}
      # ---- topology + engine sizing (see tp4 vs tp2 host env files) ----
      NNODES: ${NNODES:-4}
      TENSOR_PARALLEL_SIZE: ${TENSOR_PARALLEL_SIZE:-4}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.80}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-262144}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      KV_CACHE_MEMORY_BYTES: ${KV_CACHE_MEMORY_BYTES:-45097156608}
      BLOCK_SIZE: ${BLOCK_SIZE:-16}
      LOAD_FORMAT: ${LOAD_FORMAT:-instanttensor}
      MTP_TOKENS: ${MTP_TOKENS:-3}
      KV_DTYPE: ${KV_DTYPE:-fp8_e4m3}
      QWEN38_ENFORCE_EAGER: ${QWEN38_ENFORCE_EAGER:-0}
      QWEN38_CUDAGRAPH_MODE: ${QWEN38_CUDAGRAPH_MODE:-FULL_AND_PIECEWISE}
      COMPILATION_CONFIG: ${COMPILATION_CONFIG:-}
      # ---- toolchain/arch/caches ----
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      CUTE_DSL_ARCH: sm_121a
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_PLUGINS: ""
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TRITON_CACHE_AUTOTUNING: "1"
      TRITON_CACHE_DIR: /root/.triton
      VLLM_CACHE_ROOT: /root/.cache/vllm
      FLASHINFER_CACHE_DIR: /root/.cache/flashinfer
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/vllm/torchinductor
      B12X_COMPILE_CACHE_DIR: /root/.cache/b12x/compile
      B12X_CUTE_COMPILE_CACHE_DIR: /root/.cache/b12x/cute
    volumes:
      # per-staging-dir files: DEPLOY_DIR holds config.json + serve.sh staged from this repo
      - ${DEPLOY_DIR:?set DEPLOY_DIR to the directory you staged this repo's tp4/ files into}/config.json:/model/config.json:ro
      - ${MODEL_PATH:?set MODEL_PATH to the materialized model directory}:/model:ro
      - ${DEPLOY_DIR}/serve.sh:/experiment/serve.sh:ro
      # per-PROJECT cache namespaces: never share caches between different images/profiles
      - ${CACHE_ROOT:-${DEPLOY_DIR}/.cache}-vllm:/root/.cache/vllm
      - ${CACHE_ROOT:-${DEPLOY_DIR}/.cache}-triton:/root/.triton
      - ${CACHE_ROOT:-${DEPLOY_DIR}/.cache}-flashinfer:/root/.cache/flashinfer
      - ${CACHE_ROOT:-${DEPLOY_DIR}/.cache}-b12x:/root/.cache/b12x
      - /dev/shm:/dev/shm

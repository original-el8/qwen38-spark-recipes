# Arm D — the author's EXACT engine image on our fabric (definitive comparison)
# Image: ghcr.io/fujitsupolycom/sparkring@sha256:2375f876bc9ea065e85ae10cebad7a8db8a2ec0e6862b4441c269c5bf56365c6 (public)
# Engine call + env ported VERBATIM from profiles/qwen38-flash-next-qad-tp4/compose/compose.rank0.yaml
# (vendored reference: ../../data/author-r37-*.json|yaml), with ONLY these deviations:
#   - fabric identity: MASTER_ADDR/VLLM_HOST_IP/NODE_RANK/MODEL_PATH from our <host>.env; socket
#     iface enP2p1s0f0np0; NCCL_IB_HCA = our two HCA functions; their switchless-only pins dropped
#     (NCCL_SWITCHLESS_RING_ONLY, B12X_ROCE_PEER_HCA_MAP, OPPOSITE_PATHS, 4-name HCA list) — our
#     fabric is switched; b12x auto-policy discovers paths.
#   - API port 8015 (stock stack must be DOWN — port gate), served-model-name unified.
#   - cache root: $DEPLOY_DIR/.sparkring-cache (fresh per contract; first boot compiles ~15 min).
# Their patched NCCL (LD_PRELOAD), SPARKRING_FEATURES, SparkCache flag, capture sizes, LM-head
# trio (MXFP8=0), fuse_act_quant: ALL KEPT — that is the point of this arm.
# Usage (workers r1..r3 first, r0 last; same env files as stock recipe):
#   docker pull ghcr.io/fujitsupolycom/sparkring@sha256:2375f876bc9ea065e85ae10cebad7a8db8a2ec0e6862b4441c269c5bf56365c6   # every host
#   docker compose --env-file <host>.env -p sr-author up -d
# Readiness: GET :8015/health. Bench: llm_decode_bench --port 8015 + tools/warm-replay-probe.py.
services:
  model:
    image: ghcr.io/fujitsupolycom/sparkring@sha256:2375f876bc9ea065e85ae10cebad7a8db8a2ec0e6862b4441c269c5bf56365c6
    platform: linux/arm64
    pull_policy: missing
    init: true
    entrypoint: [/opt/venv/bin/python]
    command:
      - /opt/sparkring/bin/native-image.py
      - serve
      - /models/target
      - --served-model-name
      - Qwen3.8-Flash-Next
      - --node-rank
      - "${NODE_RANK:?}"
      - --master-addr
      - "${MASTER_ADDR:?}"
      - --tensor-parallel-size
      - "4"
      - --pipeline-parallel-size
      - "1"
      - --decode-context-parallel-size
      - "1"
      - --nnodes
      - "4"
      - --distributed-executor-backend
      - mp
      - --host
      - 0.0.0.0
      - --port
      - "8015"
      - --master-port
      - "29779"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "8192"
      - --dtype
      - bfloat16
      - --quantization
      - modelopt_mixed
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "32"
      - --load-format
      - b12x
      - --gpu-memory-utilization
      - "0.85"
      - --kv-cache-memory-bytes
      - "25769803776"
      - --mamba-cache-mode
      - align
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --gdn-decode-kernel
      - b12x
      - --linear-backend
      - b12x
      - --moe-backend
      - b12x
      - --no-enable-flashinfer-autotune
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-gb
      - "0"
      - --limit-mm-per-prompt
      - '{"image":3,"video":1}'
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"b12x","attention_backend":"B12X"}'
      - --compilation-config
      - '{"pass_config":{"fuse_act_quant":true},"cudagraph_mode":"FULL_AND_PIECEWISE","max_cudagraph_capture_size":64,"cudagraph_capture_sizes":[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64]}'
      - --media-io-kwargs
      - '{"video":{"num_frames":16}}'
      - --recurrent-checkpoint-policy
      - aligned
      - --enable-prompt-tokens-details
    environment:
      VLLM_HOST_IP: ${VLLM_HOST_IP:?}
      NCCL_SOCKET_IFNAME: enP2p1s0f0np0
      GLOO_SOCKET_IFNAME: enP2p1s0f0np0
      NCCL_IB_HCA: "=rocep1s0f0:1,roceP2p1s0f0:1"
      NCCL_SWITCHLESS_RING_ONLY: "0"
      B12X_COMPILE_CACHE_DIR: /cache/sparkring/b12x
      B12X_CUTE_COMPILE_CACHE_DIR: /cache/sparkring/cute
      B12X_ROCE_CACHE_DIR: /cache/sparkring/roce
      B12X_ROCE_GID_INDEX: "3"
      B12X_NVFP4_DYNAMIC_MATERIALIZED: "0"
      B12X_POLICY_MODE: auto
      TORCHINDUCTOR_CACHE_DIR: /cache/sparkring/inductor
      TRITON_CACHE_DIR: /cache/sparkring/triton
      VLLM_CACHE_ROOT: /cache/sparkring/vllm
      XDG_CACHE_HOME: /cache/sparkring
      B12X_ROCE_HCA: rocep1s0f0,roceP2p1s0f0
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LD_PRELOAD: /opt/local-inference/nccl/lib/libnccl.so.2
      NCCL_LIB_DIR: /opt/local-inference/nccl/lib
      NCCL_ALGO: Ring
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_DEBUG: WARN
      NCCL_IB_DISABLE: "0"
      NCCL_IB_GID_INDEX: "3"
      NCCL_IB_MERGE_NICS: "0"
      NCCL_IB_PRESERVE_PCI_DOMAIN: "1"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_MAX_NCHANNELS: "4"
      NCCL_MIN_NCHANNELS: "4"
      NCCL_NET: IB
      NCCL_NET_PLUGIN: none
      NCCL_P2P_LEVEL: SYS
      NCCL_PROTO: LL,LL128,Simple
      OMP_NUM_THREADS: "16"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      QWEN_DISPATCH_AR_BYTES: "20480"
      QWEN_DISPATCH_MODE: both
      QWEN_DISPATCH_TRACE: "0"
      SIRCL_ENABLED: "0"
      SPARKCACHE_ENABLED: "0"
      SPARKRING_FEATURES: qwen-collectives,qwen4-prefill
      SPARKRING_TRANSPORT_PROFILE: tp2-rocenante-adaptive-prepared
      VLLM_B12X_KDA_PREFILL_COALESCING: "0"
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_ENABLE_ROCE_ALLREDUCE: "1"
      VLLM_GLM53_KDA_GATE_SIDE_STREAM: "0"
      VLLM_GLM53_MHC_PREFILL_SHARD: "0"
      VLLM_LM_HEAD_A16: "1"
      VLLM_MTP_NVFP4_LM_HEAD: "1"
      VLLM_MXFP8_LM_HEAD: "0"
      VLLM_NCCL_SO_PATH: /opt/local-inference/nccl/lib/libnccl.so.2
      VLLM_PLE_CPU_OFFLOAD: "0"
      VLLM_PLUGINS: b12x_loader
      VLLM_QWEN3_8_FLASH_NEXT_MTP_COMPACT: "1"
      VLLM_QWEN3_8_FLASH_NEXT_OVERLAP: "1"
      VLLM_QWEN3_8_HC_PREFILL_MODE: shard
      VLLM_QWEN3_8_PREFILL_COALESCE: "1"
      VLLM_ROCE_ALLGATHER_MAX_SIZE: "16777216"
      VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2097152"
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    network_mode: host
    ipc: host
    ulimits: { memlock: { soft: -1, hard: -1 } }
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    devices: [/dev/infiniband]
    volumes:
      - ${MODEL_PATH:?}:/models/target:ro
      - ${DEPLOY_DIR:?}/author-config.json:/models/target/config.json:ro
      - ${DEPLOY_DIR}/.sparkring-cache:/cache
    mem_limit: 115964116992
    memswap_limit: 120259084288
